name: release

# On a pushed vX.Y.Z tag, GoReleaser builds the qw + qwproxy binaries for
# linux/darwin × amd64/arm64, then publishes a GitHub Release with the archives
# and checksums.txt. The install script (install.sh) downloads those assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
