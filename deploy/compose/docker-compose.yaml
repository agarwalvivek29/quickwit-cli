# Local simulation of the qwproxy deployment: Keycloak (stands in for Okta),
# a single-node Quickwit (seeded with a sample index + logs), Postgres (the
# audit store), and qwproxy in front. Everything talks over the compose network
# using the service names as hostnames, so the OIDC issuer is a single stable
# URL (http://keycloak:8080/realms/quickwit) for every component.
#
#   make sim-up      # start keycloak + quickwit + postgres + qwproxy (+ seed)
#   make e2e         # run the end-to-end smoke test
#   make sim-down    # tear it all down
#
# Host-side `qw` usage: add `127.0.0.1 keycloak` to /etc/hosts so the CLI's
# token issuer resolves to the same URL the proxy validates against.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  quickwit:
    image: quickwit/quickwit:0.8.2
    command: ["run"]
    environment:
      QW_LISTEN_ADDRESS: 0.0.0.0
      QW_DISABLE_TELEMETRY: "1"
      NO_COLOR: "1"
    ports:
      - "7280:7280"
    volumes:
      - qwdata:/quickwit/qwdata

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qwaudit
      POSTGRES_PASSWORD: qwaudit
      POSTGRES_DB: qwaudit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwaudit -d qwaudit"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  qwproxy:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      QWPROXY_LISTEN_ADDR: ":9000"
      QWPROXY_UPSTREAM: http://quickwit:7280
      QWPROXY_OIDC_ISSUER: http://keycloak:8080/realms/quickwit
      # Enforce aud == the app's client id. The CLI sends its ID token (aud =
      # qw-cli), so a token minted for any other client is rejected at the door.
      QWPROXY_OIDC_CLIENT_ID: qw-cli
      # Grafana's ID token arrives in X-ID-Token (aud = grafana).
      QWPROXY_OIDC_CLIENT_IDS: grafana
      QWPROXY_AUDIT_DSN: postgres://qwaudit:qwaudit@postgres:5432/qwaudit?sslmode=disable
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    # keycloak/quickwit may still be starting; retry until discovery + DB are up.
    restart: on-failure

  # Grafana + Quickwit datasource reading through qwproxy with oauthPassThru
  # (profile-gated; run via `make e2e-grafana`).
  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SERVER_ROOT_URL: http://grafana:3000
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: quickwit-quickwit-datasource
      GF_PLUGINS_PREINSTALL_SYNC: quickwit-quickwit-datasource@0.6.3
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana-secret
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://keycloak:8080/realms/quickwit/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/quickwit/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/quickwit/protocol/openid-connect/userinfo
    ports:
      - "3000:3000"
    profiles: ["grafana"]
    depends_on:
      - qwproxy

  # Drives a real Grafana OAuth login and a datasource query through qwproxy.
  e2e-grafana:
    image: alpine:3.20
    entrypoint: ["sh", "/e2e/e2e-grafana.sh"]
    volumes:
      - ./e2e:/e2e:ro
    profiles: ["grafana-tools"]
    depends_on:
      - grafana

  # One-shot: create the sample index and ingest recent logs, then exit.
  seed:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/seed/seed.sh"]
    volumes:
      - ./seed:/seed:ro
    depends_on:
      - quickwit
    restart: on-failure

  # End-to-end smoke test (profile-gated; run via `make e2e`). Builds and drives
  # the real qw binary against the running stack from inside the network.
  e2e:
    image: golang:1.26
    working_dir: /src
    entrypoint: ["sh", "/e2e/e2e.sh"]
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - ../..:/src
      - ./e2e:/e2e:ro
    profiles: ["tools"]
    depends_on:
      - qwproxy

  # Narrated walkthrough that produces docs/EXAMPLES.md (profile-gated).
  demo:
    image: golang:1.26
    working_dir: /src
    entrypoint: ["sh", "/demo/demo.sh"]
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - ../..:/src
      - ./demo:/demo:ro
    profiles: ["tools"]
    depends_on:
      - qwproxy

volumes:
  qwdata:
  pgdata:
