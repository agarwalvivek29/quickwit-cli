# Default values for quickwit-proxy (qwproxy).
# Org-standard defaults live here; per-env values only pin the image tag, the
# upstream/OIDC endpoints, and the audit secret. New toggles default OFF.

replicaCount: 2

image:
  # Public multi-arch image published by this repo's docker workflow.
  # Consumers behind a private registry (e.g. an ECR pull-through cache) override
  # image.repository in their env values.
  repository: ghcr.io/agarwalvivek29/qwproxy
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- application config (maps to QWPROXY_* env) ---
proxy:
  listenAddr: ":9000"
  # REQUIRED: in-cluster Quickwit searcher REST URL, e.g.
  # http://quickwit-system-searcher.quickwit-system.svc:7280
  upstream: ""
  oidc:
    # REQUIRED: OIDC issuer whose tokens are accepted (Okta in prod).
    issuer: ""
    # REQUIRED (unless insecureSkipAudience): this deployment's OIDC client id.
    # The CLI presents its ID token, whose aud is this client id; the proxy
    # rejects any token with a different aud (e.g. a stage token at the prod
    # proxy). Unique per app/env — this is the per-environment isolation lever.
    clientId: ""
    # Optional additional accepted client ids (audiences), so one proxy can front
    # several callers — e.g. the qw CLI plus a Grafana service identity. A token
    # is accepted when its aud matches clientId OR any of these OR audience.
    # Empty (default) keeps single-audience behaviour.
    clientIds: []
    # Legacy: expected API audience for a custom authorization server that stamps
    # aud on its access tokens. Prefer clientId on an Okta org AS / Keycloak.
    audience: ""
    # Dev-only escape hatch: accept ANY token the issuer signs (no aud check).
    # The proxy REFUSES TO START unless clientId, audience, or this is set.
    insecureSkipAudience: false
  # Drop audit partitions older than this many months.
  retentionMonths: 12
  audit:
    buffer: 4096
    batch: 100
    flushMs: 1000
    # The Postgres DSN is read from a Secret key (never inlined). By default the
    # secret name is the release fullname (created by the ExternalSecret below).
    dsnSecretName: ""
    dsnSecretKey: audit-dsn

# ExternalSecret (ESO) that pulls the audit DB DSN from AWS Secrets Manager into
# the Secret the Deployment reads. The SM value must be a JSON object containing
# at least the key named by proxy.audit.dsnSecretKey (default "audit-dsn").
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # AWS Secrets Manager key, e.g. vance-core/stage/mumbai/01/eks/secrets/quickwit-proxy
  remoteKey: ""

extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quickwit-proxy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 0 # 0 = disabled

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: ""

# Scrape qwproxy's own /metrics into VictoriaMetrics (VM operator). Off by
# default; enable per-env where the VM operator CRDs exist.
vmPodScrape:
  enabled: false
  interval: 30s

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
