apiVersion: v2
name: quickwit-proxy
description: Auth (OIDC) + audit reverse proxy in front of Quickwit's read API. Validates a bearer JWT, enforces a read-only allowlist, and records the request envelope (incl. the search query, never response bodies) to Postgres.
type: application
# First-party chart for qwproxy (github.com/agarwalvivek29/quickwit-cli).
# Bump appVersion to the published qwproxy image tag on each release.
version: 0.5.1
appVersion: "0.5.1"
home: https://github.com/agarwalvivek29/quickwit-cli
sources:
  - https://github.com/agarwalvivek29/quickwit-cli
keywords:
  - quickwit
  - proxy
  - oidc
  - audit
  - observability
maintainers:
  - name: agarwalvivek29
    url: https://github.com/agarwalvivek29
