version: 2

project_name: quickwit-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: qw
    main: ./cmd/qw
    binary: qw
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  - id: qwproxy
    main: ./cmd/qwproxy
    binary: qwproxy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: qw
    ids: [qw]
    name_template: "qw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: qwproxy
    ids: [qwproxy]
    name_template: "qwproxy_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# The qwproxy container image is published separately by
# .github/workflows/docker.yml (multi-arch + an :edge tag off main), so there
# is intentionally no `dockers:` block here.

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  prerelease: auto
